<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Интернет-магазин{% endblock %}</title>
    <!-- Bootstrap 5 от CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Дополнительные стили -->
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .card-img-top {
            height: 200px;
            object-fit: cover;
        }
        .product-description {
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }
        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 0;
            border-radius: 0 0 30px 30px;
            margin-bottom: 40px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- ===== ПОДКЛЮЧАЕМ ПОДШАБЛОН НАВИГАЦИИ ===== -->
    {% include 'catalog/nav.html' %}

    <!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
    <main>
        {% block content %}
        <!-- Содержимое будет переопределяться в дочерних шаблонах -->
        {% endblock %}
    </main>

    <!-- ===== ФУТЕР ===== -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <p class="mb-0">© 2026 MyShop. Все права защищены.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <a href="/" class="text-white text-decoration-none me-3">Главная</a>
                    <a href="/contacts/" class="text-white text-decoration-none">Контакты</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
