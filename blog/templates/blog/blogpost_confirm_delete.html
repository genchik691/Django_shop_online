{% extends 'base.html' %}

{% block title %}Удалить статью{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">🗑 Удаление статьи</h4>
                </div>
                <div class="card-body">
                    <p>Вы уверены, что хотите удалить статью <strong>"{{ object.title }}"</strong>?</p>
                    <p class="text-muted">Это действие нельзя отменить.</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">🗑 Удалить</button>
                        <a href="{% url 'blog:detail' object.pk %}" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
